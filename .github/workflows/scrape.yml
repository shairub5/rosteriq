# Every 30 min (started by cron-job.org; the schedule below is an hourly backup): ESPN stats + injuries -> Telegram alerts -> snapshot.json on the `data` branch.
name: scrape

on:
  schedule:
    # Backup only: GitHub delays or drops scheduled runs, so cron-job.org dispatches the real 30-min cadence.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with fantrax.yml: both force-push the data branch, so they take turns.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - run: flutter pub get

      # Previous snapshot = the worker's memory of what it already alerted on. Missing on the very first run.
      - name: Load previous snapshot
        run: |
          mkdir -p state
          git fetch --depth=1 origin data && git show origin/data:snapshot.json > state/snapshot.json || rm -f state/snapshot.json

      - name: Run worker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        # Last commit on main (the bot only pushes to `data`), for the 60-day keep-alive reminder.
        run: LAST_COMMIT_AT=$(git log -1 --format=%cI) dart run bin/worker.dart state/snapshot.json

      # Single orphan commit, force-pushed, so the data branch never accumulates history.
      - name: Save snapshot
        run: |
          cd state
          git init -q -b data
          git -c user.name=rosteriq-bot -c user.email=bot@users.noreply.github.com add snapshot.json
          git -c user.name=rosteriq-bot -c user.email=bot@users.noreply.github.com commit -qm "snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
